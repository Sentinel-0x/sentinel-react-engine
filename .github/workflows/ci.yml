name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pytest -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile sandbox_executor.py ast_guard.py policy.py security_monitor.py agent_core/react_agent.py agent_core/memory.py

      - name: Run unit tests (Docker available)
        run: python -m pytest test_workflow_fixes.py test_policy_layer.py -v

      - name: Verify AST guard still blocks malicious code
        run: python test_rce.py

      - name: Build networked sandbox image
        run: docker build -t sentinel-sandbox-networked:latest -f sandbox.dockerfile .

      - name: Start whitelist proxy and network
        run: |
          docker network create --internal sandbox_net
          docker run -d --name whitelist_proxy --network bridge \
            -v $(pwd)/proxy_config/squid.conf:/etc/squid/squid.conf:ro \
            -p 3128:3128 ubuntu/squid:latest
          docker network connect sandbox_net whitelist_proxy
          sleep 5

      - name: Verify network boundaries (whitelist, direct-connection block, offline mode)
        run: python ci_test_network_sandbox.py

      - name: Stop Docker daemon to test isolation-refusal behavior
        run: sudo systemctl stop docker.service docker.socket

      - name: Verify system refuses execution without Docker (no unsandboxed fallback)
        run: |
          python -c "
          from sandbox_executor import run_code_in_sandbox
          result = run_code_in_sandbox('print(1)', caller_id='ci_test')
          assert result['status'] == 'refused_no_isolation', f'Expected refusal, got {result[\"status\"]}'
          print('PASS: system correctly refused execution without Docker isolation')
          "
